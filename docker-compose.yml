# Local development dependencies. Run: docker compose up -d --wait
# The API itself runs on the host (dotnet run) so it can be debugged; see AGENTS.md section 2.

services:
  postgres:
    image: postgres:17
    container_name: platform-postgres
    environment:
      # LOCAL DEVELOPMENT ONLY. Not real credentials; never reuse outside this container.
      # platform_owner owns the schema and runs migrations; the init script below creates the
      # platform_app role the application connects as (ADR 0003).
      POSTGRES_USER: platform_owner
      POSTGRES_PASSWORD: platform_owner
      POSTGRES_DB: platform
    ports:
      # Host 5433, not 5432: the dev machine already runs a native PostgreSQL on 5432, which would
      # silently intercept connections meant for this container.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the volume is first created. After changing it: docker compose down -v
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_owner -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
